<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Delta Collection | Skincare, Body Care & Perfumes in Tanzania</title>
    <meta name="description" content="Shop genuine skincare, body care and perfumes from Delta Collection. Browse 180+ products by category and order in one tap on WhatsApp." />
    <meta name="theme-color" content="#0c0c0d" />
    <meta property="og:title" content="Delta Collection" />
    <meta property="og:description" content="Skincare, body care and perfumes. Browse the collection and order on WhatsApp." />
    <meta property="og:image" content="/brand/logo-circle.webp" />
    <script>
      // Apply the saved theme before the page paints, so it never flashes.
      try {
        var t = localStorage.getItem('dc-theme')
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
        if (t === 'light') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#faf6ef')
      } catch (e) {}
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
